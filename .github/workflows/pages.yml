name: Publicar web (GitHub Pages)

on:
  push:
    branches: [claude/epic-hawking-e9oxf6]
    paths:
      - "promo-x-cierre/**"
      - "promo-x-cierre-v1/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Raíz = versión actual (promo-x-cierre). /v1/ = copia congelada de la primera referencia.
      # Las notas internas (PROPUESTA.md) no se publican.
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r promo-x-cierre/. _site/
          mkdir _site/v1
          cp -r promo-x-cierre-v1/. _site/v1/
          rm -f _site/PROPUESTA.md
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
