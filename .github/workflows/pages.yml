name: Publicar web (GitHub Pages)

# Publica el sitio en la rama gh-pages. GitHub Pages la sirve sin pasos extra
# (si no apareciera, en Settings → Pages elegir "Deploy from a branch" → gh-pages / root).
on:
  push:
    branches: [claude/epic-hawking-e9oxf6]
    paths:
      - "promo-x-cierre/**"
      - "promo-x-cierre-v1/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Raíz = versión actual (promo-x-cierre). /v1/ = copia congelada de la primera referencia.
      # Las notas internas (PROPUESTA.md) no se publican.
      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r promo-x-cierre/. _site/
          mkdir _site/v1
          cp -r promo-x-cierre-v1/. _site/v1/
          rm -f _site/PROPUESTA.md
          touch _site/.nojekyll

      - name: Publicar en la rama gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica el sitio desde ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
